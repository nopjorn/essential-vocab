name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 1.233.0: a newer push to the same branch cancels the run still going for an older one (it tests the same code plus more).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # the Chromium download alone took 10 min once (1.154.1 run was cancelled at 15)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3] # 1.233.0: the suite runs in 3 parallel parts (about 12 min in one job before)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # 1.264.2: the site goes live only after all 3 test parts pass (Settings → Pages → Source = "GitHub Actions";
  # before, Pages published every push to master straight away, even one that failed the tests).
  # A failed or cancelled run leaves the version that is already live. Rerun the failed jobs to deploy again.
  # Upload and deploy are two jobs, as in GitHub's own Pages workflow: deploy-pages in the same job as the upload found
  # no artifact 0.35 s after it was finalised (1.264.2, first try).
  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: . # the repo root, as before (the action leaves out .git and .github)
  deploy:
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
